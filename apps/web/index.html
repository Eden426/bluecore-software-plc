<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="any" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@400&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#09090b" />

    <title>Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation</title>
    <meta
      name="description"
      content="Bluecore Software PLC builds secure, scalable software for businesses in Ethiopia and beyond — system integration, web applications, AI solutions, cloud &amp; DevOps, and digital transformation."
    />
    <link rel="canonical" href="https://blue-core.tech/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bluecore Software PLC" />
    <meta
      property="og:title"
      content="Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation"
    />
    <meta
      property="og:description"
      content="Secure, reliable, and scalable software solutions — system integration, web apps, AI, cloud &amp; DevOps, and digitization support for businesses and institutions."
    />
    <meta property="og:url" content="https://blue-core.tech/" />
    <meta property="og:image" content="https://blue-core.tech/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation"
    />
    <meta
      name="twitter:description"
      content="Secure, reliable, and scalable software solutions — system integration, web apps, AI, cloud &amp; DevOps, and digitization support for businesses and institutions."
    />
    <meta name="twitter:image" content="https://blue-core.tech/og-image.jpg" />

    <!--
      Organization/WebSite/Service/Project JSON-LD is rendered by <JsonLd> in
      App.jsx, generated at runtime from src/data/{services,portfolio,team}.js
      so it can't drift out of sync with the page content the way a hand-
      maintained static block here would. It's captured by the prerender step
      (scripts/prerender.mjs) the same as the rest of the page.
    -->
    <script>
      let theme = "dark";
      try {
        const saved = localStorage.getItem("bluecore-theme");
        theme = saved === "dark" || saved === "light" ? saved : "dark";
      } catch (_) {}
      document.documentElement.classList.toggle("dark", theme === "dark");
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#09090b" : "#ffffff";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
