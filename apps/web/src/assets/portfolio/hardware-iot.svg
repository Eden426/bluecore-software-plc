<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-label="Illustration of a microchip connected to wireless IoT sensor nodes over a circuit-board network">
  <defs>
    <linearGradient id="iotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B16" />
      <stop offset="55%" stop-color="#0A1B33" />
      <stop offset="100%" stop-color="#132038" />
    </linearGradient>
    <radialGradient id="iotGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="iotGlowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ED6B8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3ED6B8" stop-opacity="0" />
    </radialGradient>
    <filter id="iotBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <pattern id="iotDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#4C7BC8" fill-opacity="0.18" />
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#iotBg)" />
  <rect width="1600" height="800" fill="url(#iotDots)" />
  <circle cx="800" cy="400" r="300" fill="url(#iotGlowBlue)" filter="url(#iotBlur)" />
  <circle cx="1300" cy="640" r="220" fill="url(#iotGlowTeal)" filter="url(#iotBlur)" />

  <!-- circuit trace background -->
  <g stroke="#2E5C9A" stroke-width="2" stroke-opacity="0.35" fill="none">
    <path d="M0,120 H260 V220 H520" />
    <path d="M0,680 H220 V560 H460" />
    <path d="M1600,140 H1340 V260 H1120" />
    <path d="M1600,700 H1380 V580 H1160" />
  </g>
  <g fill="#5B9BF0" fill-opacity="0.5">
    <circle cx="260" cy="120" r="5" />
    <circle cx="520" cy="220" r="5" />
    <circle cx="220" cy="680" r="5" />
    <circle cx="460" cy="560" r="5" />
    <circle cx="1340" cy="140" r="5" />
    <circle cx="1120" cy="260" r="5" />
    <circle cx="1380" cy="700" r="5" />
    <circle cx="1160" cy="580" r="5" />
  </g>

  <!-- brand hex badge -->
  <g transform="translate(120,110)">
    <polygon points="46,0 92,26 92,78 46,104 0,78 0,26" fill="#0B1E36" stroke="#3ED6B8" stroke-width="2.5" />
    <text x="46" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="42" fill="#9BEFDB">bc</text>
  </g>

  <!-- connecting lines from chip to sensor nodes -->
  <g stroke="#5B9BF0" stroke-width="2.5" stroke-dasharray="7 8" fill="none" stroke-opacity="0.7">
    <path d="M800,400 L560,240" />
    <path d="M800,400 L1040,230" />
    <path d="M800,400 L540,560" />
    <path d="M800,400 L1060,580" />
    <path d="M800,400 L800,650" />
  </g>

  <!-- central microchip -->
  <g transform="translate(800,400)">
    <g stroke="#3ED6B8" stroke-width="4">
      <line x1="-70" y1="-90" x2="-70" y2="-70" />
      <line x1="-25" y1="-90" x2="-25" y2="-70" />
      <line x1="25" y1="-90" x2="25" y2="-70" />
      <line x1="70" y1="-90" x2="70" y2="-70" />
      <line x1="-70" y1="90" x2="-70" y2="70" />
      <line x1="-25" y1="90" x2="-25" y2="70" />
      <line x1="25" y1="90" x2="25" y2="70" />
      <line x1="70" y1="90" x2="70" y2="70" />
      <line x1="-90" y1="-70" x2="-70" y2="-70" />
      <line x1="-90" y1="-25" x2="-70" y2="-25" />
      <line x1="-90" y1="25" x2="-70" y2="25" />
      <line x1="-90" y1="70" x2="-70" y2="70" />
      <line x1="90" y1="-70" x2="70" y2="-70" />
      <line x1="90" y1="-25" x2="70" y2="-25" />
      <line x1="90" y1="25" x2="70" y2="25" />
      <line x1="90" y1="70" x2="70" y2="70" />
    </g>
    <rect x="-70" y="-70" width="140" height="140" rx="12" fill="#0F2646" stroke="#3ED6B8" stroke-width="3" />
    <rect x="-38" y="-38" width="76" height="76" rx="6" fill="none" stroke="#5B9BF0" stroke-width="2" />
    <circle r="14" fill="#3ED6B8" fill-opacity="0.85" />
  </g>

  <!-- sensor node cards -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(400,150)">
      <rect width="220" height="120" rx="16" fill="#0D1F3A" stroke="#2E5C9A" stroke-width="2" />
      <circle cx="38" cy="40" r="18" fill="#3ED6B8" fill-opacity="0.85" />
      <path d="M22,52 A24,24 0 0 1 54,52" stroke="#0D1F3A" stroke-width="4" fill="none" />
      <rect x="70" y="30" width="120" height="12" rx="4" fill="#D6D9E3" />
      <rect x="70" y="50" width="80" height="9" rx="3" fill="#5B9BF0" />
      <rect x="24" y="78" width="172" height="8" rx="3" fill="#274870" />
    </g>

    <g transform="translate(940,140)">
      <rect width="220" height="120" rx="16" fill="#0D1F3A" stroke="#2E5C9A" stroke-width="2" />
      <circle cx="38" cy="40" r="18" fill="#5B9BF0" fill-opacity="0.85" />
      <path d="M28,30 L48,50 M48,30 L28,50" stroke="#0D1F3A" stroke-width="4" />
      <rect x="70" y="30" width="120" height="12" rx="4" fill="#D6D9E3" />
      <rect x="70" y="50" width="90" height="9" rx="3" fill="#5B9BF0" />
      <rect x="24" y="78" width="172" height="8" rx="3" fill="#274870" />
    </g>

    <g transform="translate(380,540)">
      <rect width="220" height="120" rx="16" fill="#0D1F3A" stroke="#2E5C9A" stroke-width="2" />
      <circle cx="38" cy="40" r="18" fill="#D6A15B" fill-opacity="0.85" />
      <rect x="30" y="32" width="16" height="16" rx="3" fill="#0D1F3A" />
      <rect x="70" y="30" width="120" height="12" rx="4" fill="#D6D9E3" />
      <rect x="70" y="50" width="70" height="9" rx="3" fill="#5B9BF0" />
      <rect x="24" y="78" width="172" height="8" rx="3" fill="#274870" />
    </g>

    <g transform="translate(960,550)">
      <rect width="220" height="120" rx="16" fill="#0D1F3A" stroke="#2E5C9A" stroke-width="2" />
      <circle cx="38" cy="40" r="18" fill="#3B82F6" fill-opacity="0.85" />
      <path d="M24,50 Q38,26 52,50" stroke="#0D1F3A" stroke-width="4" fill="none" />
      <rect x="70" y="30" width="120" height="12" rx="4" fill="#D6D9E3" />
      <rect x="70" y="50" width="100" height="9" rx="3" fill="#5B9BF0" />
      <rect x="24" y="78" width="172" height="8" rx="3" fill="#274870" />
    </g>
  </g>
</svg>
