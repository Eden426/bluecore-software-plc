<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="any" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/lobster-two/LobsterTwo-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family:"Lobster Two"; src:url("/fonts/lobster-two/LobsterTwo-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:optional; }
      #site-preloader { position:fixed; inset:0; z-index:99999; display:grid; place-items:center; overflow:hidden; background:#fff; opacity:1; transition:opacity 240ms ease; }
      .dark #site-preloader { background:#09090b; }
      #site-preloader[data-state="leaving"] { opacity:0; pointer-events:none; }
      .boot-brand { position:relative; display:flex; min-height:430px; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; text-align:center; visibility:hidden; }
      #site-preloader[data-ready] .boot-brand { visibility:visible; }
      .boot-ring { position:absolute; left:50%; top:42%; width:256px; height:256px; box-sizing:border-box; border:5px solid #875131cc; border-right-color:#06243f; border-top-color:#382517; border-radius:50%; animation:boot-ring 2.6s ease-in-out both; }
      .dark .boot-ring { border-top-color:#ffffffd9; }
      .boot-word { position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:center; margin:24px 0 0; font:400 72px/1 "Lobster Two",cursive; letter-spacing:-.13em; transform:scaleX(1.38); }
      .boot-word span { display:inline-block; transform-origin:bottom; color:#01213f; --base-scale:1; --stretch-scale:1.78; animation:boot-letter 1.1s ease-out both; animation-delay:calc(var(--i) * .13s); }
      .boot-word .boot-tall { --base-scale:1.42; --stretch-scale:2.45; }
      .boot-word span:nth-child(n+5) { color:#875131; }
      .boot-line { position:relative; z-index:1; margin-top:48px; height:2px; width:256px; border-radius:2px; background:#875131; animation:boot-line 1.4s ease-out 1.25s both; }
      .boot-slogan { position:relative; z-index:1; margin:32px 0 0; font:600 10px/1.5 Inter,system-ui,sans-serif; text-transform:uppercase; letter-spacing:.32em; color:#06243f99; animation:boot-slogan 1s ease-out 1.55s both; }
      .dark .boot-slogan { color:#fff9; }
      #site-preloader:not([data-ready]) .boot-brand * { animation-play-state:paused; }
      @keyframes boot-ring { 0% { transform:translate(-50%,-50%) rotate(0deg) scale(.9); opacity:0; } 30% { opacity:1; } 100% { transform:translate(-50%,-50%) rotate(360deg) scale(1); opacity:1; } }
      @keyframes boot-letter { 0% { opacity:0; transform:scaleY(var(--base-scale)); } 25% { opacity:1; transform:scaleY(var(--base-scale)); } 58% { transform:scaleY(var(--stretch-scale)); } 82%,100% { opacity:1; transform:scaleY(var(--base-scale)); } }
      @keyframes boot-line { from { transform:scaleX(0); opacity:0; } 35% { opacity:1; } to { transform:scaleX(1); opacity:1; } }
      @keyframes boot-slogan { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
      @media(max-width:639px) { .boot-word { font-size:clamp(48px,16vw,72px); } }
      @media(min-width:640px) { .boot-ring { width:320px; height:320px; } .boot-word { margin-top:32px; font-size:128px; } .boot-line { width:384px; } .boot-slogan { font-size:14px; } }
      @media(min-width:768px) { .boot-word { font-size:160px; } }
      @media(min-width:1024px) { .boot-word { font-size:176px; } }
      @media(prefers-reduced-motion:reduce) { #site-preloader { transition:none; } .boot-brand * { animation:none!important; } .boot-ring { transform:translate(-50%,-50%); } .boot-word span { transform:scaleY(var(--base-scale)); } }
      @media print { #site-preloader { display:none; } }
    </style>
    <noscript><style>#site-preloader{display:none!important}</style></noscript>
    <meta name="theme-color" content="#09090b" />

    <title>Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation</title>
    <meta
      name="description"
      content="Bluecore Software PLC builds secure, scalable software for businesses in Ethiopia and beyond — system integration, web applications, AI solutions, cloud &amp; DevOps, and digital transformation."
    />
    <link rel="canonical" href="https://blue-core.tech/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bluecore Software PLC" />
    <meta
      property="og:title"
      content="Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation"
    />
    <meta
      property="og:description"
      content="Secure, reliable, and scalable software solutions — system integration, web apps, AI, cloud &amp; DevOps, and digitization support for businesses and institutions."
    />
    <meta property="og:url" content="https://blue-core.tech/" />
    <meta property="og:image" content="https://blue-core.tech/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bluecore Software PLC | Custom Software, AI &amp; Digital Transformation"
    />
    <meta
      name="twitter:description"
      content="Secure, reliable, and scalable software solutions — system integration, web apps, AI, cloud &amp; DevOps, and digitization support for businesses and institutions."
    />
    <meta name="twitter:image" content="https://blue-core.tech/og-image.jpg" />

    <!--
      Organization/WebSite/Service/Project JSON-LD is rendered by <JsonLd> in
      App.jsx, generated at runtime from src/data/{services,portfolio,team}.js
      so it can't drift out of sync with the page content the way a hand-
      maintained static block here would. It's captured by the prerender step
      (scripts/prerender.mjs) the same as the rest of the page.
    -->
    <script>
      let theme = "dark";
      try {
        const saved = localStorage.getItem("bluecore-theme");
        theme = saved === "dark" || saved === "light" ? saved : "dark";
      } catch (_) {}
      document.documentElement.classList.toggle("dark", theme === "dark");
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#09090b" : "#ffffff";
    </script>
  </head>
  <body>
    <template id="site-preloader-template">
      <div id="site-preloader" role="status" aria-label="Loading Bluecore website">
        <div class="boot-brand" aria-hidden="true">
          <div class="boot-ring"></div>
          <div class="boot-word">
            <span class="boot-tall" style="--i:0">B</span><span style="--i:1">L</span><span style="--i:2">U</span><span style="--i:3">E</span><span class="boot-tall" style="--i:4">C</span><span style="--i:5">O</span><span style="--i:6">R</span><span style="--i:7">E</span>
          </div>
          <div class="boot-line"></div>
          <p class="boot-slogan">Smart Software. Solid Core.</p>
        </div>
      </div>
    </template>
    <script>
      if (!document.getElementById("site-preloader")) {
        document.body.prepend(document.getElementById("site-preloader-template").content.cloneNode(true));
        const overlay = document.getElementById("site-preloader");
        // Start once the original font is ready, without a late typeface swap.
        overlay.fontReady = Promise.race([
          document.fonts.load('400 72px "Lobster Two"').catch(() => {}),
          new Promise(resolve => window.setTimeout(resolve, 1000)),
        ]).then(() => {
          overlay.dataset.ready = "";
          overlay.dataset.startedAt = String(performance.now());
        });
        // Release the page even if the app bundle cannot load.
        window.setTimeout(() => document.getElementById("site-preloader")?.remove(), 6000);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
